# Do NOT commit real values. Populate via `kubectl create secret` or a
# secrets manager (Sealed Secrets, External Secrets Operator, Vault) in
# production; this manifest documents the required keys with placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: airportos-secrets
  namespace: airportos
type: Opaque
stringData:
  SECRET_KEY: "replace-with-a-long-random-value"
  DATABASE_URL: "postgresql+asyncpg://airportos:airportos@postgres:5432/airportos"
  REDIS_URL: "redis://redis:6379/0"
  OPENAI_API_KEY: ""
